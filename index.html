<style>
body{margin:0;background:var(--paper);overflow:hidden}
a{color:var(--accent)}a:hover{color:var(--ink)}
::selection{background:var(--hl);color:var(--ink)}
.pf *{box-sizing:border-box}
.pf button{font-family:inherit}
.typed{font-family:'Courier Prime','Courier New',monospace}
.hand{font-family:'Caveat',cursive;font-weight:600;letter-spacing:0}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.label{font-family:'Courier Prime',monospace;font-size:13px;color:var(--pencil)}

/* ===== themes ===== */
@property --r{syntax:'<length>';inherits:false;initial-value:0px}
.pf{--paper:#F3EFE4;--paper0:rgba(243,239,228,0);--paper2:#FAF7EE;--ink:#1E2229;--ink2:#3A4049;--pencil:#5F6670;--red:#D23B3B;--hl:#FFE867;--hl0:rgba(255,232,103,0);--hl-soft:rgba(255,232,103,.7);--hl-btn:#FFE867;--on-hl:#1E2229;--card:#FFFDF6;--photo:#FFFFFF;--photo-bg:#F6F2E8;--photo-ink:#1E2229;--margin:rgba(210,59,59,.45);--margin2:rgba(210,59,59,.25);--grid:rgba(70,110,170,.13);--grid2:rgba(70,110,170,.16);--ink-rgb:30,34,41;--tape:rgba(236,222,178,.78);--hard:#1E2229;transition:background-color .6s,color .6s}
.pf.burnt{--paper:#22302B;--paper0:rgba(34,48,43,0);--paper2:#273630;--ink:#ECEDE6;--ink2:#D5D8CF;--pencil:#A9B0A6;--red:#F4978E;--hl:rgba(246,214,92,.33);--hl0:rgba(246,214,92,0);--hl-soft:rgba(246,214,92,.3);--hl-btn:#E9CF6A;--on-hl:#22302B;--card:#2B3B35;--photo:#ECEDE6;--photo-bg:#E3E5DC;--photo-ink:#22302B;--margin:rgba(244,151,142,.32);--margin2:rgba(244,151,142,.14);--grid:rgba(236,237,230,.05);--grid2:rgba(236,237,230,.07);--ink-rgb:236,237,230;--tape:rgba(230,220,190,.5);--hard:#101714}
.pf.burnt .paper-tex{opacity:.35;mix-blend-mode:soft-light}
.pf.burnt .h1,.pf.burnt .h2{font-family:'Cabin Sketch',cursive;font-weight:700;letter-spacing:0}
.pf.burnt .lead,.pf.burnt .body,.pf.burnt .typed,.pf.burnt .dash-list li,.pf.burnt .check-list li,.pf.burnt .index .v,.pf.burnt .index .s,.pf.burnt .navlink,.pf.burnt .filt,.pf.burnt .sk-btn,.pf.burnt .link-row,.pf.burnt .mail,.pf.burnt .label{font-family:'Patrick Hand',cursive;letter-spacing:.01em}
.pf.burnt .lead{font-size:clamp(21px,2.1vw,27px)}
.pf.burnt .body,.pf.burnt .dash-list li,.pf.burnt .check-list li{font-size:18px}
.pf.burnt .h1,.pf.burnt .h2,.pf.burnt .lead,.pf.burnt .body,.pf.burnt .note,.pf.burnt .typed,.pf.burnt .hand,.pf.burnt .dash-list,.pf.burnt .check-list,.pf.burnt .navlink,.pf.burnt .filt,.pf.burnt .mail,.pf.burnt .link-row,.pf.burnt .tag,.pf.burnt .award-tag,.pf.burnt .brand,.pf.burnt .status{filter:url(#chalkFx)}
.pf.burnt .sk-btn{background:transparent;border-color:var(--ink);box-shadow:none;border-style:solid;filter:url(#chalkFx)}
.pf.burnt .sk-btn.yellow{background:rgba(233,207,106,.16);color:var(--hl-btn);border-color:var(--hl-btn)}
.pf.burnt .sk-btn:hover{box-shadow:none;background:rgba(236,237,230,.08)}
.pf.burnt .world{opacity:.92}

.board{position:absolute;inset:0;pointer-events:none;z-index:60;display:none;box-shadow:inset 0 0 0 9px #7A5434,inset 0 0 0 11px #4E3420,inset 0 0 40px 14px rgba(0,0,0,.45);background:radial-gradient(ellipse 30% 18% at 22% 30%,rgba(255,255,255,.05),transparent 70%),radial-gradient(ellipse 26% 14% at 70% 62%,rgba(255,255,255,.045),transparent 70%),radial-gradient(ellipse 40% 20% at 50% 12%,rgba(255,255,255,.035),transparent 70%)}
.pf.burnt .board{display:block}
.pf.burnt .topbar{background:linear-gradient(var(--paper) 60%,var(--paper0))}
.pf.burnt .cur-ring.hot{mix-blend-mode:screen}
.pf.burnt .h1,.pf.burnt .h2,.pf.burnt .lead{text-shadow:0 0 1px rgba(255,255,255,.5),0 0 8px rgba(255,255,255,.06)}
.pf.burnt .polaroid{box-shadow:0 2px 2px rgba(0,0,0,.3),0 16px 34px rgba(0,0,0,.45)}
.pf.burnt .index{box-shadow:0 1px 1px rgba(0,0,0,.25),0 10px 22px rgba(0,0,0,.35)}
.pf.burnt .term-win{box-shadow:0 2px 2px rgba(0,0,0,.3),0 20px 40px rgba(0,0,0,.45) !important}
.burn-fx{position:fixed;inset:0;z-index:290;pointer-events:none;animation:burnGrow 1.25s cubic-bezier(.5,0,.75,.4) forwards}
.burn-fx.in{background:radial-gradient(circle at var(--bx) var(--by),#22302B 0,#22302B var(--r),rgba(34,48,43,.5) calc(var(--r) + 14px),transparent calc(var(--r) + 40px))}
.burn-fx.out{background:radial-gradient(circle at var(--bx) var(--by),#F3EFE4 0,#F3EFE4 var(--r),rgba(243,239,228,.6) calc(var(--r) + 14px),transparent calc(var(--r) + 40px))}
@keyframes burnGrow{from{--r:0px}to{--r:170vmax}}
.theme-btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 10px;margin-left:6px;background:transparent;border:0;color:var(--ink);cursor:pointer;font-family:'Caveat',cursive;font-weight:700;font-size:20px}
.pf .theme-btn{font-family:'Caveat',cursive}
.theme-btn svg{transition:transform .4s}
.theme-btn:hover svg{transform:rotate(-12deg) scale(1.12)}
.pf.burnt .theme-btn .flame{transform:rotate(-15deg)}
@keyframes flick{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.08,1.12) rotate(2deg)}}
.dark-room .theme-btn{color:#A1A1AA}

/* binder rings */
.binder{position:absolute;top:0;left:0;right:0;height:40px;z-index:61;pointer-events:none;display:flex;justify-content:center;gap:20px;overflow:hidden;padding-left:8px}
.ring{position:relative;flex:none;width:12px;height:40px}
.ring::before{content:"";position:absolute;left:0;top:22px;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 50% 40%,rgba(20,14,8,.85) 0,rgba(20,14,8,.7) 55%,rgba(20,14,8,.25) 75%,transparent 80%);box-shadow:inset 0 2px 2px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.5)}
.ring::after{content:"";position:absolute;left:3px;top:-8px;width:6px;height:37px;border-radius:4px 4px 3px 3px;background:linear-gradient(90deg,#5B636C 0,#C9D0D8 30%,#F4F7FA 45%,#A9B2BC 70%,#4E555D 100%);box-shadow:1px 2px 2px rgba(0,0,0,.35)}
.pf.burnt .ring::after{background:linear-gradient(90deg,#3A3F44 0,#8E969E 30%,#C9CFD4 45%,#7A828A 70%,#33383C 100%)}
.pf.burnt .ring::before{background:radial-gradient(circle at 50% 40%,#0B100E 0,#0B100E 60%,transparent 80%);box-shadow:inset 0 2px 2px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.08)}
.dark-room .ring::before{background:radial-gradient(circle at 50% 40%,#000 0,#000 60%,transparent 80%);box-shadow:inset 0 2px 2px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.08)}
.dark-room .ring::after{background:linear-gradient(90deg,#2A2D31 0,#6B7178 30%,#9AA0A6 45%,#5D6268 70%,#24272A 100%)}
.topbar > div{padding-top:40px !important}

/* ===== stickmen ===== */
.stk line,.stk path,.stk circle{stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;fill:none}
.stk .head{fill:var(--paper)}
.stk .limb{transform-box:view-box}
.stk .legL,.stk .legR{transform-origin:20px 42px}
.stk .armL,.stk .armR{transform-origin:20px 24px}
.walker .legL{transform:rotate(10deg)}.walker .legR{transform:rotate(-10deg)}.walker .armL{transform:rotate(14deg)}.walker .armR{transform:rotate(-14deg)}
/* walker */
.walker{position:absolute;left:0;bottom:46px;z-index:30;width:40px;height:70px;pointer-events:auto;will-change:transform}
.walker svg{width:40px;height:70px;overflow:visible;display:block}
.walker .bob{transform-box:view-box;transform-origin:20px 64px}
.walker.walking .legL{animation:legSwing .62s ease-in-out infinite}
.walker.walking .legR{animation:legSwing .62s ease-in-out -.31s infinite}
.walker.walking .armL{animation:armSwing .62s ease-in-out -.31s infinite}
.walker.walking .armR{animation:armSwing .62s ease-in-out infinite}
.walker.walking .bob{animation:bob .31s ease-in-out infinite}
.walker.running .legL{animation:legSwing .26s linear infinite}
.walker.running .legR{animation:legSwing .26s linear -.13s infinite}
.walker.running .armL{animation:armRun .26s linear -.13s infinite}
.walker.running .armR{animation:armRun .26s linear infinite}
.walker.running .bob{animation:bob .13s linear infinite}
.walker.trip .bob{animation:trip .8s cubic-bezier(.3,.6,.3,1) forwards}
.walker.trip .armL{animation:flail .2s linear infinite}
.walker.trip .armR{animation:flail .2s linear -.1s infinite}
.walker.wave .armR{animation:wave .35s ease-in-out infinite alternate}
.walker.scared .bob{animation:jump .35s ease-out}
@keyframes legSwing{0%,100%{transform:rotate(24deg)}50%{transform:rotate(-24deg)}}
@keyframes armSwing{0%,100%{transform:rotate(20deg)}50%{transform:rotate(-20deg)}}
@keyframes armRun{0%,100%{transform:rotate(60deg)}50%{transform:rotate(-50deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes trip{0%{transform:none}25%{transform:rotate(38deg) translateY(2px)}45%{transform:rotate(30deg) translateY(1px)}75%{transform:rotate(-6deg)}100%{transform:none}}
@keyframes flail{0%,100%{transform:rotate(-120deg)}50%{transform:rotate(-170deg)}}
@keyframes wave{from{transform:rotate(-140deg)}to{transform:rotate(-175deg)}}
@keyframes jump{0%{transform:none}40%{transform:translateY(-16px) scaleY(1.05)}100%{transform:none}}
.walker .say{position:absolute;left:24px;top:-22px;font-family:'Caveat',cursive;font-weight:700;font-size:22px;color:var(--red);white-space:nowrap;opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s}
.walker.wave .say.hi,.walker.scared .say.oh{opacity:1;transform:scale(1)}
.walker.flip svg{transform:scaleX(-1)}
.walker.flip .say{left:auto;right:24px}
.pebble{position:absolute;bottom:46px;z-index:29;width:10px;height:5px;border:2px solid var(--ink);border-radius:50% 50% 40% 40%;background:var(--paper);pointer-events:none;opacity:0;transition:opacity .4s}
.pebble.on{opacity:1}
/* pencil guy */
.pguy{display:inline-block;position:relative;width:1.5em;height:2.1em;margin:0 .15em 0 .1em;vertical-align:-.45em;cursor:default}
.pguy svg{width:100%;height:100%;overflow:visible}
.pguy .armP{transform-box:view-box;transform-origin:20px 24px;transform:rotate(-20deg)}
.pguy .whole{transform-box:view-box;transform-origin:20px 64px;transform:scale(0);opacity:0}
.view.active .pguy .whole{animation:pguyIn .45s .8s cubic-bezier(.3,1.6,.5,1) forwards}
.view.active .pguy .armP{animation:scribble .38s 1.05s ease-in-out 1,point .5s 1.5s ease-out forwards}
.view.active .pguy .legTap{animation:tap 1.4s 3s ease-in-out infinite}
@keyframes pguyIn{to{transform:none;opacity:1}}
@keyframes scribble{0%{transform:rotate(-20deg)}30%{transform:rotate(-95deg)}60%{transform:rotate(-55deg)}100%{transform:rotate(-20deg)}}
@keyframes point{to{transform:rotate(-80deg)}}
@keyframes tap{0%,60%,100%{transform:none}70%{transform:rotate(-14deg)}80%{transform:none}90%{transform:rotate(-14deg)}}
.pguy .legTap{transform-box:view-box;transform-origin:20px 42px}
.pguy:hover .armP{animation:wave .3s ease-in-out infinite alternate !important}
.pguy .say{position:absolute;left:1.1em;top:-1.1em;font-family:'Caveat',cursive;font-weight:700;font-size:.85em;color:var(--red);opacity:0;transition:opacity .2s;white-space:nowrap;pointer-events:none}
.pguy:hover .say{opacity:1}
.dark-room .walker,.dark-room .pebble{display:none}
@media (prefers-reduced-motion:reduce){.walker,.pebble{display:none}.pguy .whole{transform:none;opacity:1;animation:none !important}.pguy .armP{animation:none !important}}

.lookfor{margin:0;display:inline-flex;align-items:center;gap:12px;align-self:flex-start;padding:8px 16px 8px 12px;border:1.5px dashed rgba(var(--ink-rgb),.4);border-radius:10px 14px 8px 12px;font-family:'Courier Prime',monospace;font-size:15px;font-weight:700;color:var(--ink)}
.pf.burnt .lookfor{font-family:'Patrick Hand',cursive;font-size:17px;filter:url(#chalkFx)}
.dot-live{width:9px;height:9px;border-radius:50%;background:#2E9E5B;flex:none;position:relative}
.dot-live::after{content:"";position:absolute;inset:0;border-radius:50%;background:#2E9E5B;animation:ping 2s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{75%,100%{transform:scale(2.6);opacity:0}}
.index .stamp{position:absolute;right:14px;bottom:14px;font-family:'Courier Prime',monospace;font-weight:700;font-size:13px;color:var(--accent);border:2px solid var(--accent);border-radius:6px;padding:2px 6px;transform:rotate(-12deg);opacity:.75}
.lang-btn{min-height:36px;min-width:44px;margin-left:6px;padding:0 10px;background:transparent;border:1.5px solid var(--ink);border-radius:48% 52% 46% 54% / 55% 45% 55% 45%;color:var(--ink);font-family:'Caveat',cursive;font-weight:700;font-size:19px;cursor:pointer;transition:transform .2s,background .2s}
.pf .lang-btn{font-family:'Caveat',cursive}
.lang-btn:hover{transform:rotate(-6deg);background:var(--hl-soft)}
.dark-room .lang-btn{color:#A1A1AA;border-color:#52525B}
.pf.burnt .lang-btn{filter:url(#chalkFx)}
.game-pol{flex:999 1 420px;max-width:560px;min-width:0}
.game-doodle{position:relative;flex:0 0 230px;display:block;padding:16px 16px 10px;background:var(--card);box-shadow:0 1px 1px rgba(0,0,0,.05),0 10px 22px rgba(40,30,10,.12);transform:rotate(-2deg);text-decoration:none;color:var(--ink);transition:transform .35s cubic-bezier(.2,.7,.1,1)}
.game-doodle:hover{transform:rotate(0) translateY(-4px);color:var(--ink)}
.game-doodle svg{display:block;width:100%;height:auto;overflow:visible}
.game-doodle .cap{text-align:center;font-family:'Caveat',cursive;font-weight:600;color:var(--ink)}
/* TFG doodle explainer */
.polaroid-btn{border:0;cursor:pointer;text-align:left;font:inherit;color:inherit}
.pipe{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:22px 30px}
.pipe-step{position:relative;display:flex;flex-direction:column;gap:4px;font-family:'Courier Prime',monospace;font-size:14px;line-height:1.45;color:var(--ink2)}
.pipe-step svg{width:100%;max-width:150px;height:auto;aspect-ratio:3/2;overflow:visible;margin-bottom:6px}
.pipe-step b{font-size:16px;color:var(--ink)}
.pipe-n{font-family:'Caveat',cursive;font-weight:700;font-size:24px;line-height:1;color:var(--red)}
.pipe-step:not(:last-child)::after{content:"";position:absolute;right:-26px;top:38px;width:22px;height:14px;background:no-repeat center/contain;border-top:2px solid var(--red);border-radius:50% 50% 0 0;transform:rotate(8deg)}
.doodle-txt{font-family:'Caveat',cursive;font-weight:700;font-size:20px;fill:var(--ink)}
.doodle-txt.sm{font-size:15px}
.tfg-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:30px;margin-top:44px}
.tfg-cards .index .s{line-height:1.5}
.pf.burnt .pipe-step,.pf.burnt .doodle-txt{filter:url(#chalkFx)}
.pf.burnt .pipe-step{font-family:'Patrick Hand',cursive;font-size:16px}
/* rider + actor */
.tick{padding:0;background:transparent;cursor:pointer;transition:transform .2s}
.tick:hover{transform:rotate(-6deg) scale(1.1)}
.tick.erased svg{opacity:0;transition:opacity .25s}
.tick.redraw svg path{animation:drawIn .55s ease-out forwards !important;animation-delay:0s !important}
.actor .pencil{display:none}
.actor.writing .pencil{display:inline}
.actor.small svg{transform:scale(.62);transform-origin:50% 91%}
.actor.small.flip svg{transform:scale(-.62,.62)}
.actor.running .legL{animation:legSwing .26s linear infinite}
.actor.running .legR{animation:legSwing .26s linear -.13s infinite}
.actor.running .armL{animation:armRun .26s linear -.13s infinite}
.actor.running .armR{animation:armRun .26s linear infinite}
.actor.running .bob{animation:bob .13s linear infinite}
.actor.writing .bob{transform:rotate(16deg)}
.actor.writing .armR{animation:scrib .16s ease-in-out infinite alternate}
.actor.writing .armL{transform:rotate(30deg)}
@keyframes scrib{from{transform:rotate(-35deg)}to{transform:rotate(-70deg)}}
.actor.proud .armL{transform:rotate(160deg)}.actor.proud .armR{transform:rotate(-160deg)}
.actor.proud .bob{animation:jump .35s ease-out}
.actor.proud .say.fix,.actor.notice .say.oops{opacity:1}
.actor.notice .bob{animation:jump .3s ease-out}
.actor.hop .bob{animation:jump .3s ease-out infinite}
.actor.small .say{left:18px;top:0}
.actor.small.flip .say{left:auto;right:18px}

.ltr{display:inline}
.ltr.gone{visibility:hidden}
.ltr.back{animation:ltrBack .55s cubic-bezier(.3,1.7,.5,1)}
@keyframes ltrBack{0%{opacity:0;background:transparent}35%{opacity:1;background:var(--hl)}100%{opacity:1;background:transparent}}
.rider{position:absolute;left:0;top:0;width:34px;height:60px;z-index:65;pointer-events:none;transform-origin:0 0;will-change:transform}
.rider svg{width:34px;height:60px;overflow:visible}
.rider .armL,.rider .armR{transform-box:view-box;transform-origin:20px 24px}
.rider .armL{transform:rotate(160deg)}.rider .armR{transform:rotate(-160deg)}
.rider .legL,.rider .legR{transform-box:view-box;transform-origin:20px 42px}
.rider .legL{animation:kick .3s ease-in-out infinite alternate}
.rider .legR{animation:kick .3s ease-in-out -.15s infinite alternate}

@keyframes kick{from{transform:rotate(22deg)}to{transform:rotate(-22deg)}}
.rider .say{position:absolute;left:30px;top:6px;font-family:'Caveat',cursive;font-weight:700;font-size:20px;color:var(--red);white-space:nowrap}
.actor{position:absolute;left:0;top:0;z-index:31;width:40px;height:70px;pointer-events:none;display:none;will-change:transform}
.actor.on{display:block}
.actor svg{width:40px;height:70px;overflow:visible}
.actor .bob{transform-box:view-box;transform-origin:20px 64px}
.actor.flip svg{transform:scaleX(-1)}
.actor.pop .bob{animation:popIn .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes popIn{from{transform:scale(0)}to{transform:none}}
.actor.climbing .armL{animation:climbA .5s ease-in-out infinite alternate}
.actor.climbing .armR{animation:climbA .5s ease-in-out -.25s infinite alternate}
.actor.climbing .legL{animation:climbL .5s ease-in-out infinite alternate}
.actor.climbing .legR{animation:climbL .5s ease-in-out -.25s infinite alternate}
@keyframes climbA{from{transform:rotate(-150deg)}to{transform:rotate(-185deg)}}
@keyframes climbL{from{transform:rotate(-35deg)}to{transform:rotate(-5deg)}}
.actor.sitting .bob{transform:translateY(16px)}
.actor.sitting .legL,.actor.sitting .legR{transform:rotate(-75deg)}
.actor.sitting .legL{animation:dangle .5s ease-in-out infinite alternate}
.actor.sitting .legR{animation:dangle .5s ease-in-out -.25s infinite alternate}
@keyframes dangle{from{transform:rotate(-80deg)}to{transform:rotate(-40deg)}}
.actor.sitting .armL{transform:rotate(30deg)}.actor.sitting .armR{transform:rotate(-30deg)}
.actor.waving .bob{transform:translateY(16px)}
.actor.waving .legL,.actor.waving .legR{transform:rotate(-60deg)}
.actor.waving .armR{animation:wave .3s ease-in-out infinite alternate}
.actor.hop .bob{animation:jump .35s ease-out}
.actor.falling .bob{animation:fallSpin .7s ease-in forwards}
.actor.falling .armL{transform:rotate(150deg)}.actor.falling .armR{transform:rotate(-150deg)}
@keyframes fallSpin{to{transform:rotate(200deg);opacity:0}}
.actor.grab .bob{transform:rotate(28deg)}
.actor.grab .armL,.actor.grab .armR{transform:rotate(-20deg)}
.actor.carry .armL,.actor.carry .armR,.actor.lift .armL,.actor.lift .armR{transform:rotate(180deg)}
.actor.carry .legL{animation:legSwing .26s linear infinite}
.actor.carry .legR{animation:legSwing .26s linear -.13s infinite}
.actor.carry .bob{animation:bob .13s linear infinite}
.actor .loot{position:absolute;left:50%;bottom:62px;transform:translateX(-50%) rotate(-8deg);font-family:var(--lf,'Courier Prime'),monospace;font-weight:var(--lw,700);font-size:var(--ls,34px);line-height:1;color:var(--ink);opacity:0}
.actor.carry .loot,.actor.lift .loot{opacity:1}
.actor .say{position:absolute;left:30px;top:-18px;font-family:'Caveat',cursive;font-weight:700;font-size:21px;color:var(--red);white-space:nowrap;opacity:0;transition:opacity .2s}
.actor.waving .say.hi,.actor.carry .say.mine{opacity:1}
.actor.flip .say{left:auto;right:30px}
.actor .legL{transform:rotate(10deg)}.actor .legR{transform:rotate(-10deg)}
@media (prefers-reduced-motion:reduce){.actor,.rider{display:none !important}}

/* ===== god-mode city ===== */
.city-floor{position:absolute;left:0;right:0;bottom:0;height:215px;z-index:24;pointer-events:none;background-color:var(--paper);background-image:linear-gradient(90deg,transparent clamp(14px,4.4vw,64px),var(--margin) clamp(14px,4.4vw,64px),var(--margin) calc(clamp(14px,4.4vw,64px) + 1.5px),transparent calc(clamp(14px,4.4vw,64px) + 1.5px)),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:100% 100%,24px 24px,24px 24px;background-position:0 0,0 0,0 0;background-attachment:scroll,fixed,fixed;-webkit-mask-image:linear-gradient(to bottom,transparent 0,rgba(0,0,0,.85) 42%,#000 60%);mask-image:linear-gradient(to bottom,transparent 0,rgba(0,0,0,.85) 42%,#000 60%)}
.dark-room .city-floor,.retro-on .city-floor{display:none}

.world{position:absolute;inset:0;width:100%;height:100%;z-index:25;pointer-events:none}
.dark-room .world{display:none}
.pf.quake{animation:quakeShake .6s linear}
@keyframes quakeShake{0%,100%{transform:none}10%{transform:translate(-5px,2px)}20%{transform:translate(4px,-3px)}30%{transform:translate(-4px,-2px)}40%{transform:translate(5px,3px)}50%{transform:translate(-3px,2px)}60%{transform:translate(3px,-2px)}70%{transform:translate(-2px,2px)}80%{transform:translate(2px,-1px)}90%{transform:translate(-1px,1px)}}

/* paper */
.paper-tex{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.35;mix-blend-mode:multiply;z-index:0}
.margin-line{position:absolute;top:0;bottom:0;left:clamp(14px,4.4vw,64px);width:1.5px;background:var(--margin);pointer-events:none;z-index:1}
.margin-line::after{content:"";position:absolute;top:0;bottom:0;left:4px;width:1px;background:var(--margin2)}

/* views */
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;opacity:0;visibility:hidden;transition:none;z-index:2}
.view.active{opacity:1;visibility:visible;transition:opacity .45s ease,visibility 0s 0s}
.view::-webkit-scrollbar{width:8px}.view::-webkit-scrollbar-thumb{background:rgba(var(--ink-rgb),0.2);border-radius:4px}
.page{width:100%;max-width:1200px;margin:0 auto;padding:140px clamp(28px,6vw,96px) 190px clamp(40px,8vw,120px)}
.st{opacity:0}
.view.active .st{animation:stIn .8s cubic-bezier(.2,.7,.1,1) both}
@keyframes stIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.mask{display:block;overflow:hidden;padding-bottom:0.06em}
.mask > span{display:inline-block;transform:translateY(105%)}
.view.active .mask > span{animation:up 1s cubic-bezier(.2,.8,.1,1) forwards}
@keyframes up{to{transform:none}}

/* type */
.h1{margin:0;font-family:'Courier Prime',monospace;font-weight:700;font-size:clamp(46px,6.6vw,96px);letter-spacing:-0.035em;line-height:1;color:var(--ink)}
.h2{margin:0;font-family:'Courier Prime',monospace;font-weight:700;font-size:clamp(40px,5vw,68px);letter-spacing:-0.03em;line-height:1;color:var(--ink)}
.lead{margin:0;font-family:'Courier Prime',monospace;font-size:clamp(19px,1.9vw,24px);line-height:1.5;color:var(--ink)}
.body{margin:0;font-family:'Courier Prime',monospace;font-size:16px;line-height:1.75;color:var(--ink2)}
.note{font-family:'Caveat',cursive;font-weight:600;color:var(--red);font-size:24px;line-height:1.1}
.note.pen{color:var(--accent)}
.hl{background-image:linear-gradient(104deg,var(--hl0) 0.5%,var(--hl) 2%,var(--hl) 96%,var(--hl0) 99%);background-repeat:no-repeat;background-size:0% 62%;background-position:0 78%;padding:0 4px;margin:0 -4px}
.view.active .hl{animation:hl .9s cubic-bezier(.3,.7,.2,1) forwards;animation-delay:var(--d,.8s)}
@keyframes hl{to{background-size:100% 62%}}
.strike{position:relative;white-space:nowrap;color:var(--pencil)}
.strike::after{content:"";position:absolute;left:-3%;right:-3%;top:55%;height:2.5px;background:var(--red);border-radius:2px;transform:scaleX(0) rotate(-3deg);transform-origin:left center}
.view.active .strike::after{animation:strike .35s ease-out forwards;animation-delay:var(--d,1s)}
@keyframes strike{to{transform:scaleX(1) rotate(-3deg)}}
.draw path,.draw ellipse,.draw line,.draw polyline{stroke-dasharray:1;stroke-dashoffset:1}
.view.active .draw path,.view.active .draw ellipse,.view.active .draw line,.view.active .draw polyline{animation:drawIn .9s ease-out forwards;animation-delay:var(--d,1s)}
@keyframes drawIn{to{stroke-dashoffset:0}}

/* nav */
.topbar{position:absolute;top:0;left:0;right:0;z-index:50;background:linear-gradient(var(--paper) 60%,var(--paper0))}
.navlink{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;font-family:'Courier Prime',monospace;font-size:16px;color:var(--pencil);background:transparent;border:0;cursor:pointer;white-space:nowrap;transition:color .2s}
.navlink:hover{color:var(--ink)}
.navlink.on{color:var(--ink);font-weight:700}
.navlink svg{position:absolute;left:-2px;top:2px;width:calc(100% + 4px);height:40px;overflow:visible;pointer-events:none;opacity:0}
.navlink.on svg{opacity:1}
.navlink.on svg path{stroke-dasharray:1;stroke-dashoffset:1;animation:drawIn .6s ease-out forwards}
.navnum{display:none}
.brand{display:flex;align-items:center;gap:12px;background:transparent;border:0;padding:0;cursor:pointer;color:var(--ink);min-height:44px;text-align:left}
.brand-box{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border:2px solid var(--ink);border-radius:46% 54% 50% 50% / 52% 46% 54% 48%;font-family:'Caveat',cursive;font-weight:700;font-size:20px;transform:rotate(-6deg);transition:transform .3s}
.brand:hover .brand-box{transform:rotate(6deg)}

/* realistic notebook page turn: compositor-only (transforms driven by the Web Animations API) */
.view.flip-out,.view.flip-in{z-index:20;overflow:hidden !important;pointer-events:none;background-color:var(--paper);background-image:linear-gradient(90deg,transparent clamp(14px,4.4vw,64px),var(--margin) clamp(14px,4.4vw,64px),var(--margin) calc(clamp(14px,4.4vw,64px) + 1.5px),transparent calc(clamp(14px,4.4vw,64px) + 1.5px)),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:100% 100%,24px 24px,24px 24px;transform-origin:0 0;will-change:transform;backface-visibility:hidden}
.pf-under{position:absolute;left:0;top:0;width:100%;height:22%;z-index:19;pointer-events:none;transform-origin:0 0;will-change:transform;background:linear-gradient(to bottom,rgba(40,25,10,.34),rgba(40,25,10,.14) 22%,rgba(40,25,10,0))}
.pf-shade{position:absolute;left:0;top:0;width:100%;height:40px;z-index:63;pointer-events:none;transform-origin:0 0;will-change:transform;background:linear-gradient(to top,rgba(40,25,10,.26),rgba(40,25,10,0))}
.pf-flap{position:absolute;left:0;top:0;width:100%;height:100%;z-index:64;pointer-events:none;transform-origin:0 0;will-change:transform;background-color:var(--paper2);background-image:linear-gradient(to bottom,rgba(255,255,255,0) 70%,rgba(255,255,255,.38) 93%,rgba(255,255,255,.1) 97.5%,rgba(90,60,25,.32) 100%)}

/* buttons */
.sk-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 24px;font-family:'Courier Prime',monospace;font-weight:700;font-size:16px;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;box-shadow:3px 3px 0 var(--hard);text-decoration:none;cursor:pointer;transition:transform .15s,box-shadow .15s,background .2s}
.sk-btn:hover{transform:translate(-1px,-2px) rotate(-.5deg);box-shadow:5px 5px 0 var(--hard);color:var(--ink)}
.sk-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--hard)}
.sk-btn.yellow{background:var(--hl-btn);color:var(--on-hl)}
.sk-btn .arr{transition:transform .2s}
.sk-btn:hover .arr{transform:translateX(4px)}

/* tape, polaroids, cards */
.tape{position:absolute;width:96px;height:28px;background:var(--tape);box-shadow:0 1px 2px rgba(0,0,0,.08);clip-path:polygon(3% 0,97% 4%,100% 50%,96% 100%,2% 96%,0 50%);z-index:3}
.polaroid{position:relative;background:var(--photo);padding:12px 12px 46px;box-shadow:0 2px 2px rgba(0,0,0,.06),0 16px 34px rgba(40,30,10,.16);transition:transform .45s cubic-bezier(.2,.7,.1,1),box-shadow .45s}
.polaroid:hover{transform:rotate(0deg) scale(1.02) !important;box-shadow:0 2px 2px rgba(0,0,0,.06),0 24px 48px rgba(40,30,10,.22)}
.polaroid .cap{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-family:'Caveat',cursive;font-weight:600;font-size:22px;color:var(--photo-ink)}
.index{position:relative;background-color:var(--card);background-image:linear-gradient(transparent 44px,var(--margin) 44px,var(--margin) 45.5px,transparent 45.5px),repeating-linear-gradient(transparent 0 69px,var(--grid2) 69px 70px,transparent 70px 94px);padding:16px 20px 22px;box-shadow:0 1px 1px rgba(0,0,0,.05),0 10px 22px rgba(40,30,10,.10);transition:transform .35s cubic-bezier(.2,.7,.1,1)}
.index:hover{transform:rotate(0) translateY(-4px) !important}
.index .k{font-family:'Caveat',cursive;font-weight:600;font-size:22px;color:var(--red);height:28px;display:block}
.index .v{display:block;margin-top:10px;font-family:'Courier Prime',monospace;font-weight:700;font-size:20px;line-height:1.25;color:var(--ink)}
.index .s{display:block;margin-top:6px;font-family:'Courier Prime',monospace;font-size:14px;color:var(--pencil)}
.check-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.check-list li{display:flex;align-items:center;gap:10px;font-family:'Courier Prime',monospace;font-size:16px;color:var(--ink);min-height:28px}
.tick{width:20px;height:20px;flex:none;border:1.5px solid var(--ink);border-radius:3px 5px 4px 3px;display:flex;align-items:center;justify-content:center}
.tick svg{width:22px;height:22px;margin:-4px -2px 0 0;overflow:visible}

/* terminal on paper */
.term-paper{position:relative;transform:rotate(-1.2deg);transition:transform .4s cubic-bezier(.2,.7,.1,1)}
.term-paper:hover{transform:rotate(0)}
.pf .qchip{font-family:'Courier Prime',monospace}
.qchip{min-height:32px;padding:0 10px;border-radius:4px;border:1.5px dashed rgba(var(--ink-rgb),.45);background:var(--card);color:var(--ink);font-size:14px;cursor:pointer;transition:all .2s}
.qchip:hover{background:var(--hl);border-style:solid;border-color:var(--ink)}

/* marquee */
.mq{display:flex;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mq-track{display:flex;flex:none;gap:40px;padding-right:40px;animation:mq 45s linear infinite}
.mq:hover .mq-track{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-100%)}}
.mq-item{display:flex;align-items:center;gap:40px;white-space:nowrap;font-family:'Courier Prime',monospace;font-size:18px;color:var(--ink2)}
.mq-item i{font-style:normal;color:var(--red);font-family:'Caveat',cursive;font-size:22px}

/* work */
.next-box{border:2px dashed rgba(var(--ink-rgb),.3);border-radius:10px 14px 8px 12px;padding:28px 32px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.dash-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.dash-list li{font-family:'Courier Prime',monospace;font-size:16px;line-height:1.6;color:var(--ink2);padding-left:22px;position:relative}
.dash-list li::before{content:"—";position:absolute;left:0;color:var(--red)}
.tag{font-family:'Caveat',cursive;font-weight:600;font-size:21px;color:var(--accent);padding:0 6px;border:1.5px solid currentColor;border-radius:50% 45% 55% 48% / 55% 50% 48% 52%}

/* background */
.filt{min-height:44px;padding:0 16px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--pencil);font-family:'Courier Prime',monospace;font-size:16px;cursor:pointer;transition:color .2s,border-color .2s}
.pf .filt{font-family:'Courier Prime',monospace}
.filt:hover{color:var(--ink)}
.filt.on{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.tl-item{animation:stIn .6s cubic-bezier(.2,.7,.1,1) both}
.tl-item .tl-title{transition:background-size .5s}
.tl-item:hover .tl-title{background-size:100% 55%}
.tl-title{background-image:linear-gradient(var(--hl),var(--hl));background-repeat:no-repeat;background-size:0% 55%;background-position:0 85%}
.award-tag{font-family:'Caveat',cursive;font-weight:700;font-size:24px;color:var(--red);transform:rotate(-4deg);display:inline-block}

/* contact */
.mail{position:relative;display:inline-block;font-family:'Courier Prime',monospace;font-weight:700;font-size:clamp(20px,2.6vw,34px);color:var(--ink);text-decoration:none;padding-bottom:10px}
.mail svg{position:absolute;left:-2%;bottom:-6px;width:104%;height:18px;overflow:visible}
.mail svg path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .6s ease}
.mail:hover{color:var(--ink)}
.mail:hover svg path{stroke-dashoffset:0}
.link-row{display:flex;justify-content:space-between;align-items:center;min-height:54px;border-bottom:1.5px dashed rgba(var(--ink-rgb),.25);font-family:'Courier Prime',monospace;font-size:17px;color:var(--ink);text-decoration:none;transition:padding .3s cubic-bezier(.2,.7,.1,1),background .3s}
.link-row:hover{padding-left:10px;color:var(--ink);background:linear-gradient(90deg,var(--hl-soft),transparent)}
.link-row .arr{color:var(--accent);transition:transform .3s}
.link-row:hover .arr{transform:translate(3px,-3px)}
.plane{animation:plane 6s ease-in-out infinite}
@keyframes plane{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(10px,-8px) rotate(4deg)}}

/* dark secret room adjustments */
.dark-room .topbar{background:linear-gradient(#0B0B0C 60%,rgba(11,11,12,0))}
.dark-room .navlink{color:#71717A}.dark-room .navlink:hover{color:#FAFAFA}
.dark-room .brand{color:#E4E4E7}.dark-room .brand-box{border-color:#E4E4E7}
.dark-room .status{color:#52525B}
.sec-room{background:#0B0B0C}
.secret-link{font-family:'Caveat',cursive !important;font-weight:700;font-size:22px !important;color:var(--red) !important}
.secret-link.on{color:#FAFAFA !important}
.cur-ring.secret{border-color:var(--red) !important;box-shadow:none !important}

/* status */
.status{position:absolute;left:0;right:0;bottom:0;z-index:40;pointer-events:none;color:var(--pencil)}

/* terminal */
.run-btn{display:inline-flex;align-items:center;gap:8px;min-height:30px;padding:0 10px;border-radius:7px;border:1px solid rgba(250,250,250,0.12);background:rgba(250,250,250,0.04);color:#D4D4D8;font-family:'Geist Mono',monospace;font-size:11px;cursor:pointer;transition:background .25s,color .25s,border-color .25s}
.run-btn:hover{background:var(--accent);border-color:var(--accent);color:#09090B}
.run-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:runPulse 1.6s ease-in-out infinite}
.run-btn:hover .run-dot{background:#09090B}
@keyframes runPulse{0%,100%{opacity:1}50%{opacity:.25}}
.code-body{display:block;width:100%;height:300px;text-align:left;padding:20px 20px 22px;font-size:13px;line-height:1.85;color:#D4D4D8;white-space:normal;overflow:hidden;background:transparent;border:0;cursor:pointer;transition:background .3s}
.code-body:hover{background:rgba(250,250,250,0.025)}
.code-body .code-line{display:block;white-space:pre}
.term-out{color:#D4D4D8;white-space:normal}
.term-out div{white-space:pre-wrap;word-break:break-word;min-height:1.7em}
.term-out::-webkit-scrollbar{width:6px}.term-out::-webkit-scrollbar-thumb{background:#27272A;border-radius:3px}
.tl-cmd{color:#FAFAFA}.tl-cmd::before{content:"~$ ";color:#52525B}
.tl-out{color:#A1A1AA}.tl-hint{color:#71717A;font-style:italic}.tl-acc{color:var(--accent)}.tl-err{color:#FCA5A5}.tl-ok{color:#86EFAC}
.tl-out,.tl-acc,.tl-err,.tl-ok,.tl-cmd{animation:lnIn .25s ease both}
@keyframes lnIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.term-in{flex:1;min-width:0;background:transparent;border:0;outline:none;color:#FAFAFA;font-family:'Geist Mono',monospace;font-size:13px;caret-color:var(--accent)}
.term-in::placeholder{color:#52525B}
.pf .qchip,.pf .run-btn{font-family:'Geist Mono',monospace}
.qchip{min-height:30px;padding:0 10px;border-radius:7px;border:1px solid rgba(250,250,250,0.1);background:transparent;color:#A1A1AA;font-family:'Geist Mono',monospace;font-size:12px;cursor:pointer;transition:all .2s}
.qchip:hover{color:#09090B;background:var(--accent);border-color:var(--accent)}
.hint-line{animation:hintIn .8s 2.4s ease both}
@keyframes hintIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}


/* secret nav link: visible only inside the cursor circle */
.secret-link{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;font-size:14px;background:transparent;border:0;cursor:pointer;white-space:nowrap;color:var(--accent);-webkit-mask-image:radial-gradient(circle 42px at var(--sx,-200px) var(--sy,-200px),#000 96%,transparent 100%);mask-image:radial-gradient(circle 42px at var(--sx,-200px) var(--sy,-200px),#000 96%,transparent 100%)}
.secret-link .navnum{color:var(--accent)}
.secret-link:focus-visible,.secret-link.on{-webkit-mask-image:none;mask-image:none}
.secret-link.on{color:#FAFAFA}
@media (hover:none){.secret-link{-webkit-mask-image:none;mask-image:none;opacity:.25}}
.cur-ring.secret{width:84px;height:84px;margin:-42px 0 0 -42px;background:transparent;border:1px dashed var(--accent);mix-blend-mode:normal;box-shadow:0 0 24px rgba(125,211,252,0.25)}

/* ===== secret room ===== */
.sec-room{position:relative;min-height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:120px 0 80px}
.sec-vignette{position:absolute;inset:0;background:radial-gradient(ellipse 55% 50% at 50% 50%,rgba(125,211,252,0.06),transparent 70%),radial-gradient(ellipse at center,transparent 40%,#000 100%);pointer-events:none}
.sec-room::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(rgba(255,255,255,0) 0 2px,rgba(255,255,255,0.025) 2px 3px);animation:secFlick 5s steps(1) infinite}
@keyframes secFlick{0%,100%{opacity:1}47%{opacity:.6}48%{opacity:1}82%{opacity:.75}83%{opacity:1}}
.sec-noise{position:absolute;inset:-50%;width:200%;height:200%;opacity:.05;pointer-events:none;animation:grainShift 1s steps(6) infinite}
@keyframes grainShift{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-2%)}100%{transform:translate(0,0)}}
.sec-whisper{font-size:12px;letter-spacing:0.18em;text-transform:lowercase;color:#52525B}
.view.active .sec-whisper{animation:stIn .9s cubic-bezier(.2,.7,.1,1) both,whisper 6s 2s ease-in-out infinite}
@keyframes whisper{0%,100%{color:#52525B}50%{color:#A1A1AA}}
.glitch-btn{background:transparent;border:0;padding:0 10px;color:#FAFAFA}
.glitch{position:relative;display:inline-block;font-family:'Geist Mono',monospace;font-size:clamp(96px,17vw,240px);font-weight:500;letter-spacing:-0.06em;line-height:1;color:#E4E4E7;text-shadow:0 0 40px rgba(125,211,252,0.25);animation:gFlicker 4s infinite;transition:color .4s,text-shadow .4s}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.glitch::before{color:var(--accent);mix-blend-mode:screen;animation:gA 3.2s infinite steps(1)}

.r-wrap{width:min(800px,100%);margin:0 auto;padding:18px 12px 120px}

.r-title{font-family:'Comic Sans MS','Comic Sans',cursive;font-size:clamp(30px,5vw,46px);font-weight:bold;color:#FFFF00;text-shadow:3px 3px 0 #FF0000,6px 6px 0 #0000FF;text-align:center;margin:18px 0 6px;line-height:1.1}
.r-sub{text-align:center;color:#00FF00;font-family:'Courier New',monospace;font-size:15px}
.blink{animation:rblink 1s steps(1) infinite}
@keyframes rblink{50%{visibility:hidden}}
.r-new{display:inline-block;background:#FF0000;color:#FFFF00;font-family:Arial,sans-serif;font-weight:bold;font-size:11px;padding:1px 4px;margin-left:6px;vertical-align:middle;transform:rotate(-8deg)}
.r-construction{margin:16px 0;padding:6px;text-align:center;font-family:Arial Black,Arial,sans-serif;font-weight:900;font-size:15px;letter-spacing:2px;color:#000;background:repeating-linear-gradient(45deg,#FFD700 0 16px,#000 16px 32px)}

.r-btn.on{border-color:#404040 #FFFFFF #FFFFFF #404040;background:#A8A8A8;color:#000080 !important;font-weight:bold}

.r-content{position:relative}
